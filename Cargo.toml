[package]
name = "gaussian-splat-rasterizer"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "3D Gaussian Splatting rasterizer in Rust + vulkano, with Slang shaders and debug views"

[dependencies]
vulkano = "0.35"
winit = "0.30"
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
